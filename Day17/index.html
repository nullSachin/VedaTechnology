<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Password Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="panel">

  <header class="panel__header">
    <p class="eyebrow">Security Tools</p>
    <h1>Password Generator</h1>
    <p class="subtitle">Choose your options and generate a strong, random password instantly.</p>
  </header>

  <section class="output">
    <div class="output__row">
      <input type="text" id="passwordField" class="output__field" readonly spellcheck="false" aria-label="Generated password" value="">
      <button type="button" class="icon-btn" id="regenBtn" aria-label="Generate new password" title="Generate new password">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M16.5 3.5v4h-4M3.5 16.5v-4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.2 8.3a6 6 0 0 1 10.4-2.9l1.9 2.1M15.8 11.7a6 6 0 0 1-10.4 2.9l-1.9-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="icon-btn icon-btn--accent" id="copyBtn" aria-label="Copy password" title="Copy password">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="7.5" y="7.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 12.5v-7a1 1 0 0 1 1-1h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="copy-confirm" id="copyConfirm">Copied!</span>
      </button>
    </div>

    <p class="warning" id="warningMsg" hidden>Select at least one character type below.</p>

    <div class="strength" id="strengthWrap">
      <div class="strength__bar"><span id="strengthFill"></span></div>
      <span class="strength__label" id="strengthLabel">—</span>
    </div>
  </section>

  <section class="controls">

    <div class="control">
      <div class="control__label-row">
        <label for="lengthSlider">Length</label>
        <span class="control__value" id="lengthValue">16</span>
      </div>
      <input type="range" id="lengthSlider" min="4" max="32" value="16">
    </div>

    <div class="control">
      <span class="control__label-row__title">Character types</span>
      <div class="checkbox-grid">
        <label class="checkbox">
          <input type="checkbox" id="optUpper" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__text">Uppercase <em>ABC</em></span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="optLower" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__text">Lowercase <em>abc</em></span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="optNumbers" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__text">Numbers <em>123</em></span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="optSymbols" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__text">Symbols <em>!@#</em></span>
        </label>
      </div>
    </div>

  </section>

  <button type="button" class="generate-btn" id="generateBtn">Generate password</button>

  <footer class="panel__footer">
    <p>Task 17 · Random Password Generator · Web Development Track</p>
  </footer>

</main>

<script src="script.js"></script>
</body>
</html>
