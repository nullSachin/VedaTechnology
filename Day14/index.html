<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap">

  <header class="header">
    <div class="header__text">
      <p class="eyebrow">Color Tools</p>
      <h1>Palette Generator</h1>
      <p class="subtitle">Generate a fresh five-color palette, then click any swatch to copy its hex code.</p>
    </div>
    <button class="generate-btn" id="generateBtn" type="button">
      <svg class="generate-btn__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M16.5 3.5v4h-4M3.5 16.5v-4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.2 8.3a6 6 0 0 1 10.4-2.9l1.9 2.1M15.8 11.7a6 6 0 0 1-10.4 2.9l-1.9-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Generate palette
    </button>
  </header>

  <section class="palette" id="palette" aria-label="Generated color palette"></section>

  <p class="hint">Tip: click a swatch, or its hex code, to copy it — or press the spacebar to generate a new palette.</p>

  <footer class="footer">
    <p>Task 14 · Color Palette Generator · Web Development Track</p>
  </footer>

</main>

<template id="swatchTemplate">
  <div class="swatch" tabindex="0" role="button">
    <div class="swatch__color"></div>
    <div class="swatch__footer">
      <span class="swatch__hex"></span>
      <span class="swatch__copied">Copied!</span>
    </div>
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
